[project]
name = "contract-clause-reviewer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery>=5.7.0",
    "fastapi>=0.162.0",
    "granian[reload,uvloop]>=2.8.7",
    "openai>=3.46.0",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "sqlmodel>=0.0.48",
    "starlette-cramjam>=0.7.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "freezegun>=1.5.5",
    "httpx2>=2.16.0",
    "ipykernel>=7.4.0",
    "ipython>=9.18.1",
    "py-pglite[sqlalchemy]>=0.5.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.basedpyright]
typeCheckingMode = "basic"
