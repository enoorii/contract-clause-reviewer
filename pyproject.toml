[project]
name = "contract-clause-reviewer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi>=0.139.0",
    "granian[reload,uvloop]>=2.7.9",
    "openai>=2.50.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlmodel>=0.0.39",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.37.0",
    "freezegun>=1.5.5",
    "httpx2>=2.10.0",
    "ipykernel>=7.3.0",
    "ipython>=9.16.0",
    "py-pglite[sqlalchemy]>=0.5.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.basedpyright]
typeCheckingMode = "basic"
